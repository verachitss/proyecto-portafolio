<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#bgGrad1)"/>
  <!-- Barra superior simulando navegador -->
  <rect x="0" y="0" width="600" height="40" fill="#0b1120"/>
  <circle cx="25" cy="20" r="6" fill="#ef4444"/>
  <circle cx="45" cy="20" r="6" fill="#eab308"/>
  <circle cx="65" cy="20" r="6" fill="#22c55e"/>
  <rect x="90" y="10" width="340" height="20" rx="4" fill="#1e293b"/>
  <!-- Interfaz de Procesamiento Transaccional ISO 8583 -->
  <rect x="40" y="70" width="250" height="100" rx="8" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="105" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold">MTI: 0200 (Financial Req)</text>
  <text x="60" y="130" fill="#94a3b8" font-family="monospace" font-size="12">Field 003: Processing Code</text>
  <text x="60" y="150" fill="#94a3b8" font-family="monospace" font-size="12">Field 039: Response Code 00</text>

  <rect x="310" y="70" width="250" height="100" rx="8" fill="#a855f7" opacity="0.15" stroke="#a855f7" stroke-width="1.5"/>
  <text x="330" y="105" fill="#a855f7" font-family="monospace" font-size="14" font-weight="bold">Validación de Tramas</text>
  <text x="330" y="130" fill="#22c55e" font-family="monospace" font-size="12">✓ Longitudes de Campo OK</text>
  <text x="330" y="150" fill="#22c55e" font-family="monospace" font-size="12">✓ Integridad de Datos OK</text>

  <rect x="40" y="190" width="520" height="100" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="60" y="225" fill="#f8fafc" font-family="monospace" font-size="13">&gt; Angular 16 Frontend + .NET Core Backend</text>
  <text x="60" y="250" fill="#94a3b8" font-family="monospace" font-size="12">&gt; Azure Linux Server / Payara / API REST</text>
  <text x="300" y="325" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SISTEMA TRANSACCIONAL &amp; ESTÁNDAR ISO 8583</text>
</svg>
